name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 도구 버전
        run: |
          xcodebuild -version
          xcrun swift-format --version || echo "swift-format 없음 (lint 건너뜀)"
          xcrun simctl list devices available | head -40

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: make check
        run: make check
