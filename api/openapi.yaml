openapi: 3.1.0
info:
  title: Herezi API
  version: 0.5.0
  description: |
    Herezi 공개 API 계약. 이 파일이 서버·iOS·Android 사이의 단일 기준이다.
    변경 시 하위호환을 지키고, 앱 레포는 `make sync-api`로 이 파일을 가져간다.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /v1/spots:
    get:
      operationId: listSpots
      summary: 위치 기준 근처의 "지금 볼 만한 것" 목록 (키워드 검색 포함)
      description: |
        `lat`/`lng`는 항상 필수다. 위치 권한이 없으면 앱은 서울시청(37.5663, 126.9779)을 보낸다(검색 포함).
        `q`를 주면 다른 필터와 함께(AND) 키워드로 더 좁힌다. 끝난 항목은 검색 결과에도 나오지 않는다.
        다음 페이지를 받을 때는 `next_cursor`와 함께 같은 파라미터(`q` 포함)를 그대로 보낸다.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double } }
        - name: radius_m
          in: query
          schema: { type: integer, minimum: 100, maximum: 20000, default: 3000 }
        - name: category
          in: query
          description: 쉼표로 구분한 카테고리 목록
          schema: { type: string, example: "festival,popup" }
        - name: when
          in: query
          schema: { type: string, enum: [now, today, weekend, week], default: now }
        - name: free
          in: query
          description: true면 무료 항목만
          schema: { type: boolean, default: false }
        - name: q
          in: query
          description: |
            키워드 검색. 제목·장소명·주소 중 하나에 대소문자 무시 부분 일치하는 항목만.
            앞뒤 공백을 자른 뒤 1~50자(유니코드 글자 수)여야 하며, 벗어나면(공백만 있는 경우 포함) 400.
            `%`, `_`는 와일드카드가 아니라 글자 그대로 찾는다.
          schema: { type: string, minLength: 1, maxLength: 50, example: 빛초롱 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotPage" }
        "400":
          description: 잘못된 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/spots/map:
    get:
      operationId: listSpotsInBBox
      summary: 지도 영역(bbox) 안의 항목. 클러스터링은 앱에서 한다
      description: |
        남서(sw)·북동(ne) 꼭짓점으로 지정한 영역 안의 항목을 영역 중심에서 가까운 순으로 최대 `limit`개 돌려준다.
        더 있으면 `truncated`가 true다(지도를 확대하면 더 보인다). 날짜변경선을 넘는 영역(sw_lng > ne_lng)은 지원하지 않는다.
      parameters:
        - { name: sw_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: sw_lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: ne_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: ne_lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - name: category
          in: query
          description: 쉼표로 구분한 카테고리 목록
          schema: { type: string, example: "festival,popup" }
        - name: when
          in: query
          schema: { type: string, enum: [now, today, weekend, week], default: now }
        - name: free
          in: query
          description: true면 무료 항목만
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotMap" }
        "400":
          description: 잘못된 파라미터 (sw가 ne보다 북쪽·동쪽인 경우 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/spots/{id}:
    get:
      operationId: getSpot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spot" }
        "404":
          description: 없음 (끝난 항목은 404가 아니라 200 + is_ended=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/geo/reverse:
    get:
      operationId: reverseGeocode
      summary: 좌표 → 행정구역 이름 (앱 상단 위치명, 예 "중구 태평로1가")
      description: |
        네이버 Reverse Geocoding을 서버가 대신 부른다(Client Secret은 서버에만 있다).
        좌표는 소수 3자리(약 100m)로 반올림해 1일 동안 캐시한다. 서울 밖도 그대로 돌려준다.
        결과가 없는 좌표(바다 등)는 200 + 빈 문자열. 501·502이면 앱은 OS 지오코더 결과를 쓴다.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoReverse" }
        "400":
          description: 잘못된 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: 서버에 네이버 키가 설정되지 않음 (code=not_configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 네이버 호출 실패·타임아웃(2초) (code=upstream_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Category:
      type: string
      enum: [nature, festival, performance, exhibition, popup, food, family, pet, sports]
    Spot:
      type: object
      required: [id, title, category, lat, lng, starts_at, source, fetched_at, is_ended]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string, description: GPT가 정리한 2~3줄 요약 }
        category: { $ref: "#/components/schemas/Category" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }
        place_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_free: { type: boolean }
        image_url: { type: string, format: uri }
        source: { type: string, description: "tourapi | kopis | seoul_culture | ..." }
        source_url: { type: string, format: uri }
        fetched_at: { type: string, format: date-time, description: 원본 소스에서 마지막으로 가져온 시각(앱의 "갱신 시각") }
        distance_m: { type: integer, description: "요청 위치로부터의 거리 (/v1/spots에서만)" }
        is_ended:
          type: boolean
          description: |
            응답 시각 기준으로 끝났는지(ends_at < now). 목록·지도는 끝난 항목을 반환하지 않으므로 항상 false.
            상세(/v1/spots/{id})는 끝난 항목도 200으로 반환하고 true로 표시한다 — 앱은 '종료됨'으로 보여준다(찜 목록에서 흐리게).
    SpotPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Spot" }
        next_cursor: { type: string }
    SpotMap:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Spot" }
        truncated: { type: boolean, description: 영역 안에 limit보다 많은 항목이 있으면 true }
    GeoReverse:
      type: object
      required: [area1, area2, area3, label]
      properties:
        area1: { type: string, description: "시·도 (예: 서울특별시)", example: 서울특별시 }
        area2: { type: string, description: "시·군·구 (예: 중구)", example: 중구 }
        area3: { type: string, description: "읍·면·동 (예: 태평로1가)", example: 태평로1가 }
        label:
          type: string
          description: 앱에 보여줄 위치명. area2 + " " + area3(빈 값은 생략), 둘 다 없으면 area1, 결과가 없으면 빈 문자열
          example: 중구 태평로1가
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
