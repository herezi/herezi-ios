# XcodeGen spec. The .xcodeproj is GENERATED from this file (`make generate`) and is gitignored.
# Edit this file, never the .xcodeproj. See docs/adr/0002-xcodegen-no-checked-in-xcodeproj.md
name: Herezi
options:
  bundleIdPrefix: com.herezi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Official Naver Maps iOS SDK SPM wrapper. See docs/adr/0003-naver-map-sdk.md
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    exactVersion: 3.24.1

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    # 네이버 지도 SDK 헤더(NMFUtils.h)가 iOS 26에서 deprecated된 UIScreen.mainScreen을 쓴다.
    # Swift의 warnings-as-errors가 clang 모듈 빌드에도 -Werror로 전달되므로 이 경고만 에러에서 제외한다.
    # 우리 Swift 코드의 deprecated 사용은 여전히 에러다. SDK가 고쳐지면 제거. (docs/adr/0003-naver-map-sdk.md)
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-error=deprecated-declarations"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple 개인 개발팀 (비밀값 아님). 자동 서명.
    DEVELOPMENT_TEAM: KHYU5VTC3M
    # 버전: 마케팅 버전은 여기서, 빌드 번호는 make upload BUILD_NUMBER=N 으로 덮어쓴다.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      HEREZI_API_BASE_URL: "http://localhost:8080"
      # 서버 배포 전이라 Debug는 샘플 데이터(FakeSpotsService)가 기본. 스킴 환경 변수 HEREZI_FAKE_API=0으로 끌 수 있다.
      HEREZI_USE_FAKE_API: "YES"
    Release:
      # 실서버 API (Railway, herezi-api docs/ops/railway.md). 도메인 구매 후 api.herezi.com 으로 교체.
      HEREZI_API_BASE_URL: "https://api-production-4ebcf3e2.up.railway.app"
      HEREZI_USE_FAKE_API: "NO"

targetTemplates:
  Module:
    type: framework
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.herezi.$(PRODUCT_NAME:rfc1034identifier)
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "NO"

targets:
  # Layer 0: pure models + ports. Foundation only.
  Domain:
    templates: [Module]
    sources: [Sources/Domain]

  # Layer 1: HTTP adapter for the API contract (api/openapi.yaml).
  Networking:
    templates: [Module]
    sources: [Sources/Networking]
    dependencies:
      - target: Domain

  # Layer 1: map UI component. The ONLY target allowed to import NMapsMap.
  MapUI:
    templates: [Module]
    sources: [Sources/MapUI]
    dependencies:
      - target: Domain
      # 핀·클러스터 색·글꼴 토큰 (DESIGN §6.6). DesignSystem은 MapUI를 모른다.
      - target: DesignSystem
      - package: NMapsMap

  # Layer 1: 디자인 토큰·공통 컴포넌트 (herezi-api docs/design/DESIGN.md). SwiftUI + Domain만.
  DesignSystem:
    templates: [Module]
    sources: [Sources/DesignSystem]
    dependencies:
      - target: Domain

  # Layer 2: feature UI. Depends on Domain (ports) + MapUI, never on Networking.
  FeatureNearby:
    templates: [Module]
    sources: [Sources/Features/Nearby]
    dependencies:
      - target: Domain
      - target: DesignSystem
      - target: MapUI

  FeatureSpotDetail:
    templates: [Module]
    sources: [Sources/Features/SpotDetail]
    dependencies:
      - target: Domain
      - target: DesignSystem

  FeatureHome:
    templates: [Module]
    sources: [Sources/Features/Home]
    dependencies:
      - target: Domain
      - target: DesignSystem

  FeatureSaved:
    templates: [Module]
    sources: [Sources/Features/Saved]
    dependencies:
      - target: Domain
      - target: DesignSystem

  FeatureSearch:
    templates: [Module]
    sources: [Sources/Features/Search]
    dependencies:
      - target: Domain
      - target: DesignSystem

  FeatureSettings:
    templates: [Module]
    sources: [Sources/Features/Settings]
    dependencies:
      - target: Domain
      - target: DesignSystem

  FeatureOnboarding:
    templates: [Module]
    sources: [Sources/Features/Onboarding]
    dependencies:
      - target: Domain
      - target: DesignSystem

  # Layer 3: composition root. Wires adapters into features.
  Herezi:
    type: application
    platform: iOS
    sources:
      - Sources/App
      # Pretendard v1.3.9 (github.com/orioncactus/pretendard 릴리스 Pretendard-1.3.9.zip의 public/static),
      # SIL OFL 1.1 — 라이선스 OFL.txt를 같이 번들하고 설정 > 오픈소스 라이선스에서 보여준다.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: Domain
      - target: Networking
      - target: DesignSystem
      - target: FeatureHome
      - target: FeatureNearby
      - target: FeatureSpotDetail
      - target: FeatureSaved
      - target: FeatureSearch
      - target: FeatureSettings
      - target: FeatureOnboarding
      - target: MapUI
      # MapUI가 링크하는 동적 프레임워크를 앱 번들에 임베드한다 (없으면 실행 즉시 dyld 크래시).
      - package: NMapsMap
      - sdk: CoreLocation.framework
    info:
      path: Sources/App/Info.plist
      properties:
        # 홈 화면에 보이는 이름
        CFBundleDisplayName: 히어지
        # 세로 전용 iPhone 앱. 멀티태스킹 회전 요구 경고를 없앤다.
        UIRequiresFullScreen: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 지금 내 주변의 축제·공연·전시를 보여드리기 위해 위치를 사용해요.
        HereziAPIBaseURL: $(HEREZI_API_BASE_URL)
        HereziUseFakeAPI: $(HEREZI_USE_FAKE_API)
        # Naver Cloud Platform Maps client ID (from Config/Secrets.xcconfig; empty is OK for build/test).
        NMFNcpKeyId: $(NAVER_MAPS_CLIENT_ID)
        # 폴더 참조(Fonts/)로 번들되므로 경로에 폴더 이름을 붙인다.
        UIAppFonts:
          - Fonts/Pretendard-Regular.otf
          - Fonts/Pretendard-Medium.otf
          - Fonts/Pretendard-SemiBold.otf
          - Fonts/Pretendard-Bold.otf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herezi.app
        PRODUCT_NAME: Herezi
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
        # 앱 아이콘: Sources/App/Assets.xcassets/AppIcon (두리번 로고, 1024 단일 크기)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HereziTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HereziTests
        excludes: ["Fixtures/**"]
      - path: Tests/HereziTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Domain
      - target: Networking
      - target: DesignSystem
      - target: FeatureHome
      - target: FeatureNearby
      - target: FeatureSpotDetail
      - target: FeatureSaved
      - target: FeatureSearch
      - target: FeatureSettings
      - target: FeatureOnboarding
      - target: MapUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.herezi.app.tests

schemes:
  Herezi:
    build:
      targets:
        Herezi: all
        HereziTests: [test]
    test:
      config: Debug
      targets: [HereziTests]
    run:
      config: Debug
